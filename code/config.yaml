# Decision thresholds. Initial values are UNTUNED placeholders; Phase 3 tunes them on the dev split.
# Bench "Save to config.yaml" rewrites the `thresholds` block.
thresholds:
  t_lo: 0.35        # fused liveness below this -> DENY (presentation attack)
  t_hi: 0.70        # fused liveness at/above this (and match ok) -> ALLOW
  t_match: 90.0     # Rekognition similarity (0-100) at/above this -> identity confirmed
  t_match_lo: 50.0  # similarity below this -> DENY (clearly a different person)

# Liveness fusion. Variant A = MiniFASNet only; B = + FFT/moire cue; C = B + motion cue.
# D = cloud-only (hid-gate rules), E = fused local + cloud (see `cloud:` below and backend/decision.py).
fusion:
  default_variant: A
  moire_lo: 0.30    # moire raw score mapped linearly: <= lo -> 0 spoof evidence, >= hi -> 1
  moire_hi: 0.60    # (a natural photo measured 0.27; range is a placeholder until Phase 3)
  w_moire: 0.5      # max liveness penalty from the moire cue
  motion_ref: 0.02  # non-rigid landmark motion (fraction of inter-eye distance) treated as fully live
  w_motion: 0.3     # max liveness penalty when no non-rigid motion is observed

# Quality gates (any failure -> REQUEST_VERIFICATION). Amber band = within 25% of the limit.
quality:
  min_blur: 60.0          # Laplacian variance of the 112px-wide face crop
  min_brightness: 60.0    # mean grey level of the face crop (0-255)
  max_brightness: 210.0
  min_face_frac: 0.18     # face box height / frame height
  max_yaw: 0.35           # |nose offset from eye midpoint| / inter-eye distance (~0.35 ~= 25 deg)
  max_roll_deg: 20.0

detector:
  score_threshold: 0.7
  max_side: 640           # frames are downscaled to this before detection

match:
  provider: rekognition   # rekognition | none
  region: us-east-1
  collection: hid-liveness-faces
  live_interval_s: 1.0    # live mode: at most one CompareFaces call per this many seconds
  keepalive_s: 120        # keep the Rekognition TLS connection warm (cold call measured ~2.2 s)

# Active challenges (enrollment + verify step-up). Signals: MediaPipe blendshapes (blink/smile), YuNet yaw.
challenge:
  timeout_s: 10           # per challenge
  retries: 1              # a timed-out challenge is replaced by a different random one, once
  session_timeout_s: 90
  blink_closed: 0.45      # both eyeBlink blendshapes >= this = eyes closed
  blink_open: 0.25        # both <= this = eyes open
  smile_neutral: 0.30
  smile_on: 0.60
  frontal_yaw: 0.12       # |yaw ratio| considered "facing the camera"
  turn_yaw: 0.25          # |yaw ratio| needed for a head turn (~15-20 deg)
  gesture_timeout_s: 15   # finger gesture is checked by the VLM ~once per second, so it gets longer
  gesture_interval_s: 1.0
  left_yaw_sign: 1        # +1: user's-left turn => positive yaw on un-mirrored frames (flip if wrong)

enrollment:
  center_frames: 10       # frontal good-quality frames scored by passive liveness
  min_liveness: 0.70      # mean MiniFASNet score required (>= verify t_hi by default)
  challenges: [blink, turn_left, turn_right, fingers]   # randomised order; fingers = VLM-counted gesture
  references: 4           # sharpest+most frontal frames kept as reference set
  duplicate_similarity: 95.0  # SearchFacesByImage hit on ANOTHER ID above this blocks enrollment

stepup:
  challenges: 1           # number of random challenges for REQUEST_VERIFICATION step-up
  pool: [blink, turn_left, turn_right]

storage:
  bucket: auto            # auto = hid-liveness-<account id> (scripts/aws_resources.py); "" = no S3

# Cloud signals ported from hid-gate (Bedrock vision model + Rekognition DetectLabels/DetectFaces).
cloud:
  enabled: true
  model: us.anthropic.claude-haiku-4-5-20251001-v1:0   # A0: works; warm ~0.95-1.2 s, cold ~2.6 s
  fallback_model: amazon.nova-lite-v1:0                # A0: works; ~0.7-1.1 s (NOT auto-switched)
  budget_ms: 1400         # from cloud launch; unfinished signals = timeout -> E/D never ALLOW (fail closed)
  keepalive_s: 20         # Bedrock text-only warm-up while idle (cold image call 2.6 s -> 1.4 s after warm-up)
  vlm_live_min: 0.75      # VLM live >= this counts as live (hid-gate LIVE_MIN)
  vlm_spoof_max: 0.30     # VLM live <= this counts as spoof -> DENY (hid-gate SPOOF_MAX)
  d_sim_min: 80.0         # variant D: similarity below this = no match -> DENY (hid-gate search threshold)
  d_sim_strong: 95.0      # variant D: similarity needed for ALLOW without a challenge (hid-gate SIM_STRONG)
  rk_min_brightness: 25   # Rekognition DetectFaces quality (second opinion)
  rk_min_sharpness: 20
  rk_min_face_width: 0.15
  gesture_same_min: 90.0  # finger gesture: CompareFaces(reference, gesture frame) must be >= this

# Which variant the public kiosk uses. PROVISIONAL until held-out results exist: E is the fail-closed
# fused variant (A alone accepts a clean digital photo; see CLAUDE.md). Change after Phase 3.
kiosk:
  variant: E

budget_ms: 2000
